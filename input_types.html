<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Input Types</h1>
    <form>
        <!-- First Name -->
        <label>Enter First Name:</label>
        <input type="text" placeholder="firstName">
        <br>
        <br>
        <!-- Last Name -->
        <label>Enter Last Name:</label>
        <input type="text" placeholder="LastName">
        <br>
        <br>
        <!-- Email -->
        <label>Enter Email ID</label>
        <input type="email" placeholder="Enter Email">
        <br>
        <br>
        <!-- Phone No -->
        <label>Enter Phone Number</label>
        <input type="number" placeholder="Enter No">
        <br>
        <br>
        <!-- Password -->
        <label>Enter Password</label>
        <input type="password" placeholder="Enter Password">
        <br>
        <br>
        <!-- DOB-->
        <label>Date of Birth</label>
        <input type="date"/>
        <br>
        <br>
        <!-- Month-->
        <label>Month</label>
        <input type="month"/>
        <br>
        <br>
        <!-- weel-->
        <label>week</label>
        <input type="week"/>
        <br>
        <br>
        <!-- Time-->
        <label>Time</label>
        <input type="time"/>
        <br>
        <br>
        <!-- Date and Time-->
        <label>Date and Time</label>
        <input type="datetime-local"/>
        <br>
        <br>
        <!-- Color-->
        <label>Select Color</label>
        <input type="color"/>
        <br>
        <br>
        <!-- Range-->
        <label>Select Range</label>
        <input type="range"/>
        <br>
        <br>
        <!-- File-->
        <label>Upload Docs</label>
        <input type="file"  multiple/>
        <br>
        <br>
        <!-- Search-->
        <label>Search</label>
        <input type="search"/>
        <br>
        <br>
        <!-- URL-->
        <label>URL</label>
        <input type="url"/>
        <br>
        <br>
        <!-- Telephone-->
        <label>Enter Telephone</label>
        <input type="tel"/>
        <br>
        <br>
       <!-- Checkbox-->
        <label>Choose Any 2 Cities</label>
        <input type="checkbox" checked/>Mumbai
        <input type="checkbox"/>Delhi
        <input type="checkbox"/>Palus
        <input type="checkbox"/>Kolhapur
        <br>
        <br>
        <!-- Department-->
        <label>Select Gender</label>
        <input type="radio" name="department"/>IT
        <input type="radio" name="department"/>CSE
        <input type="radio" name="department"/>ENTC
        <input type="radio" name="department"/>AIDS
        <br>
        <br>
        <label>Select ur Fav Dish</label>
        <select>
            <option>Choose..</option>
            <option>Pav Bhaji</option>
            <option>Masur</option>
            <option>Kaju Kari</option>
            <option>Panner</option>
        </select>
        <br>
        <br>

    <label>Address</label>
    <input type="text" placeholder="Enter Address">
        <textarea rows="5" cols="40"> </textarea>
        <br>
        <br>
        <input type="submit" value="Submitform"/>
        <input type="button" value="Submitform"/>
        <input type="reset" value="Submitform"/>

    </form>
</body>
</html>
